name: NIFTY Spot 11 Days
on:
  schedule:
    - cron: '45 10 * * 1-5' # 16:15 IST; GitHub schedules can be delayed.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nifty-11-days
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install yfinance pandas gspread google-auth
      - name: Update NIFTY tab
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python nifty_11_days.py
