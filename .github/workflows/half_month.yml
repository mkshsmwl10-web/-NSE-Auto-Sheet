name: Update Half-Month Stock ETF Scanner

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: half-month-stock-etf-scanner
  cancel-in-progress: false

jobs:
  update-half-month:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread pandas yfinance google-auth

      - name: Update editable watchlist and signals
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python half_month_scanner.py

      - name: Refresh weekly and monthly equity dashboard
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python equity_dashboard.py

      - name: Publish equity chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/charts/equity-performance.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish equity performance candles [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
