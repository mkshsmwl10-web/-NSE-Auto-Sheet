name: Update Half-Month Stock ETF Scanner

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: half-month-stock-etf-scanner
  cancel-in-progress: false

jobs:
  update-half-month:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread pandas yfinance google-auth

      - name: Update editable watchlist and signals
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python half_month_scanner.py

