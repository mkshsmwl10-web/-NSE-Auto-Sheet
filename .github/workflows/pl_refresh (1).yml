name: Live P-L Refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-pl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install gspread google-auth yfinance
      - env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python pl_refresh.py
