name: Update NSE Sheet

on:
  schedule:
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sma-charts-publish
  cancel-in-progress: false

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread oauth2client pandas numpy requests yfinance
          python -c "import yfinance; print('YFINANCE OK:', yfinance.__version__)"

      - name: Run SMA Scanner
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python update_sheet.py

      - name: Commit and Publish SMA Charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/charts/
          git diff --cached --quiet && { echo "No chart changes"; exit 0; }
          git commit -m "Publish SMA charts [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
