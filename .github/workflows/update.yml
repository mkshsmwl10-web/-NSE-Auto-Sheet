name: Trend Scanner Auto Trade

on:
  # GitHub ka backup schedule
  schedule:
    - cron: '0 5 * * 1-5'   # 10:30 AM IST

  # External cron-job.org trigger
  repository_dispatch:
    types: [nse_1030_trade]

  # Manual run = scanner only, NO TRADE
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread oauth2client pandas numpy requests yfinance
          python -c "import yfinance; print('YFINANCE OK:', yfinance.__version__)"

      - name: Run Main Scanner
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python update_sheet.py

      - name: Run Trend Scanner and Portfolio
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          EXECUTE_TRADES: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && 'true' || 'false' }}
        run: |
          python trend_scanner.py

      - name: Save Pattern Charts to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update pattern charts [skip ci]"
          git push
