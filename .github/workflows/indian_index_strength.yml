name: Indian Index Strength Scanner

on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indian-index-strength
  cancel-in-progress: false

jobs:
  index-strength:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth pandas yfinance requests
      - name: Update separate index and stock leader sheets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python indian_indices_scanner.py
      - name: Publish interactive index chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/charts/indian-index-strength.html
          git add data/sector_index_checked.json
          if [ -f data/sector_index_ohlc.csv ]; then
            git add data/sector_index_ohlc.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Indian index interactive charts [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
