name: NIFTY200 CAR Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '45 14 * * 1-5'

permissions:
  contents: read

jobs:
  car:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install gspread google-auth pandas numpy yfinance
      - name: Update separate CAR tabs
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python car_scanner.py
