
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LALITHAA Trend Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { box-sizing:border-box; }
body { margin:0; background:#0f172a; color:#e5e7eb; font-family:Arial,Helvetica,sans-serif; }
.header { padding:18px 22px; background:#111827; border-bottom:1px solid #334155; }
.title { font-size:24px; font-weight:700; }
.subtitle { margin-top:6px; color:#94a3b8; }
.status-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 20px; }
.status { padding:12px; border-radius:8px; text-align:center; font-weight:700; }
.positive { background:#14532d; color:#dcfce7; }
.negative { background:#7f1d1d; color:#fee2e2; }
.nodata { background:#374151; color:#f8fafc; }
.toolbar { padding:8px 20px 14px; }
button { border:1px solid #475569; background:#1e293b; color:white; padding:9px 17px; margin-right:7px; border-radius:6px; cursor:pointer; font-weight:700; }
button.active { background:#2563eb; }
.info { padding:0 20px 10px; color:#cbd5e1; }
#chart { width:100%; height:650px; }
@media(max-width:700px) {
  .status-grid { grid-template-columns:1fr; }
  #chart { height:520px; }
}
</style>
</head>
<body>
<div class="header">
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
</div>
<div class="status-grid">
  <div id="dailyStatus" class="status">Daily</div>
  <div id="weeklyStatus" class="status">Weekly</div>
  <div id="monthlyStatus" class="status">Monthly</div>
</div>
<div class="toolbar">
  <button id="Daily" onclick="renderTF('Daily')">1D</button>
  <button id="Weekly" onclick="renderTF('Weekly')">1W</button>
  <button id="Monthly" onclick="renderTF('Monthly')">1M</button>
  <button onclick="fitChart()">Fit</button>
</div>
<div class="info" id="info"></div>
<div id="chart"></div>
<script>
const DATA = {"name": "LALITHAA", "code": "LALITHAA", "cmp": 304.9, "Daily": {"trend": "POSITIVE", "reference": 247.35, "bars": [{"time": "2026-08-24", "open": 265.0, "high": 274.4, "low": 244.4, "close": 248.44}, {"time": "2026-08-25", "open": 250.0, "high": 259.19, "low": 248.0, "close": 249.87}, {"time": "2026-08-26", "open": 252.75, "high": 253.75, "low": 242.25, "close": 244.0}, {"time": "2026-08-27", "open": 245.0, "high": 255.5, "low": 240.35, "close": 246.23}, {"time": "2026-08-28", "open": 247.35, "high": 267.9, "low": 245.52, "close": 265.24}, {"time": "2026-08-31", "open": 266.9, "high": 272.4, "low": 256.01, "close": 257.89}, {"time": "2026-09-01", "open": 259.35, "high": 283.65, "low": 257.0, "close": 267.6}, {"time": "2026-09-02", "open": 269.0, "high": 272.8, "low": 262.55, "close": 264.35}, {"time": "2026-09-03", "open": 267.05, "high": 283.0, "low": 262.2, "close": 280.3}, {"time": "2026-09-04", "open": 283.0, "high": 308.3, "low": 280.6, "close": 306.7}, {"time": "2026-09-07", "open": 314.0, "high": 326.8, "low": 309.5, "close": 317.75}, {"time": "2026-09-08", "open": 319.0, "high": 322.4, "low": 312.4, "close": 318.75}, {"time": "2026-09-09", "open": 320.0, "high": 339.95, "low": 319.95, "close": 334.45}, {"time": "2026-09-10", "open": 341.0, "high": 343.9, "low": 329.0, "close": 337.6}, {"time": "2026-09-11", "open": 337.9, "high": 343.6, "low": 330.3, "close": 338.6}, {"time": "2026-09-14", "open": 338.6, "high": 338.6, "low": 338.6, "close": 338.6}, {"time": "2026-09-15", "open": 321.7, "high": 321.7, "low": 321.7, "close": 321.7}, {"time": "2026-09-16", "open": 305.65, "high": 305.65, "low": 305.65, "close": 305.65}, {"time": "2026-09-17", "open": 295.0, "high": 299.7, "low": 290.4, "close": 290.4}, {"time": "2026-09-18", "open": 280.0, "high": 304.9, "low": 277.0, "close": 304.9}]}, "Weekly": {"trend": "POSITIVE", "reference": 265.0, "bars": [{"time": "2026-08-28", "open": 265.0, "high": 274.4, "low": 240.35, "close": 265.24}, {"time": "2026-09-04", "open": 266.9, "high": 308.3, "low": 256.01, "close": 306.7}, {"time": "2026-09-11", "open": 314.0, "high": 343.9, "low": 309.5, "close": 338.6}, {"time": "2026-09-18", "open": 338.6, "high": 338.6, "low": 277.0, "close": 304.9}]}, "Monthly": {"trend": "NEGATIVE", "reference": 265.0, "bars": [{"time": "2026-08-31", "open": 265.0, "high": 274.4, "low": 240.35, "close": 257.89}]}};
let chart = null;
let candleSeries = null;

document.getElementById("title").textContent = DATA.name + " (" + DATA.code + ")";
document.getElementById("subtitle").textContent = "CMP: " + DATA.cmp;

function statusClass(trend) {
  if (trend === "POSITIVE") return "status positive";
  if (trend === "NEGATIVE") return "status negative";
  return "status nodata";
}

function setupStatuses() {
  [["dailyStatus","Daily"],["weeklyStatus","Weekly"],["monthlyStatus","Monthly"]].forEach(pair => {
    const el = document.getElementById(pair[0]);
    const tf = pair[1];
    el.className = statusClass(DATA[tf].trend);
    el.innerHTML = tf + "<br>" + DATA[tf].trend;
  });
}

function renderTF(tf) {
  document.querySelectorAll(".toolbar button").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById(tf);
  if (btn) btn.classList.add("active");

  const holder = document.getElementById("chart");
  holder.innerHTML = "";
  const item = DATA[tf];

  document.getElementById("info").innerHTML =
    "<b>" + tf + " Trend:</b> " + item.trend +
    " &nbsp;&nbsp; <b>Active Reversal Open:</b> " +
    (item.reference === null ? "-" : item.reference);

  chart = LightweightCharts.createChart(holder, {
    width:holder.clientWidth,
    height:holder.clientHeight,
    layout:{ background:{ color:"#0f172a" }, textColor:"#cbd5e1" },
    grid:{ vertLines:{ color:"#1e293b" }, horzLines:{ color:"#1e293b" } },
    rightPriceScale:{ borderColor:"#475569" },
    timeScale:{ borderColor:"#475569", timeVisible:true }
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:"#22c55e",
    downColor:"#ef4444",
    borderVisible:false,
    wickUpColor:"#22c55e",
    wickDownColor:"#ef4444"
  });

  candleSeries.setData(item.bars);

  if (item.reference !== null) {
    candleSeries.createPriceLine({
      price:item.reference,
      color:"#f59e0b",
      lineWidth:2,
      lineStyle:2,
      axisLabelVisible:true,
      title:"Reference Open"
    });
  }

  chart.timeScale().fitContent();
}

function fitChart() {
  if (chart) chart.timeScale().fitContent();
}

setupStatuses();
try {
  renderTF("Daily");
} catch (err) {
  document.getElementById("chart").innerHTML =
    '<div style="padding:24px;color:#fecaca;font-weight:700;">Chart error: ' +
    String(err) + '</div>';
  console.error(err);
}

window.addEventListener("resize", () => {
  if (!chart) return;
  const holder = document.getElementById("chart");
  chart.applyOptions({ width:holder.clientWidth });
});
</script>
</body>
</html>
