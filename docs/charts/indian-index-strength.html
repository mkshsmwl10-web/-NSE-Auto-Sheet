function attachShapeEvents(){if(eventsAttached)return;chartElement.on('plotly_relayout',ev=>{if(Object.keys(ev).some(k=>k.indexOf('shapes')===0))saveShapes()});eventsAttached=true}
$('draw').addEventListener('input',()=>{try{let r=savedData();r.note=$('draw').value;localStorage.setItem(storageKey(),JSON.stringify(r))}catch(e){}});

function option(sel,value,label){let x=document.createElement('option');x.value=value;x.textContent=label;sel.appendChild(x)}
keys.forEach(k=>{option($('idx'),k,k);option($('compare'),k,k)});$('compare').value='';
const params=new URLSearchParams(location.search);let initial=params.get('index');
if(initial&&!db.indices[initial])initial='';
$('idx').value=initial||keys[0]||'';
function candidates(){let index=db.indices[$('idx').value];$('asset').innerHTML='';if(!index)return;
(index.assets||[]).forEach(a=>option($('asset'),a.symbol,a.symbol));
const requested=params.get('asset');if(requested&&Array.from($('asset').options).some(o=>o.value===requested))$('asset').value=requested;
}
function series(a){return (a?.d||[]).map(z=>({d:new Date(z[0]),x:z[0],o:z[1],h:z[2],l:z[3],c:z[4],v:z[5]}))}
function sma(a,n){return a.map((_,i)=>i+1<n?null:a.slice(i+1-n,i+1).reduce((v,z)=>v+z.c,0)/n)}
function ema(a,n){const p=2/(n+1);let last=null;return a.map(z=>last=(last===null?z.c:(z.c*p+last*(1-p))))}
function rsi(a,n=14){let g=0,l=0;const out=a.map(()=>null);if(a.length<n+1)return out;
for(let i=1;i<=n;i++){let ch=a[i].c-a[i-1].c;g+=Math.max(0,ch);l+=Math.max(0,-ch)}
g/=n;l/=n;out[n]=l===0?100:100-100/(1+g/l);
for(let i=n+1;i<a.length;i++){let ch=a[i].c-a[i-1].c;g=(g*(n-1)+Math.max(ch,0))/n;l=(l*(n-1)+Math.max(-ch,0))/n;
out[i]=l===0?100:100-100/(1+g/l)}return out}
function draw(){let group=db.indices[$('idx').value],asset=group?.assets.find(z=>z.symbol===$('asset').value);
if(!asset){$('notice').textContent='Data unavailable for this index/asset. Check Yahoo symbol in Index Universe.';Plotly.purge('chart');Plotly.purge('rsiPanel');Plotly.purge('volumePanel');return}
$('notice').textContent='Price returns, not total returns. Tracked stock list is editable and not necessarily the complete official index membership.';
let values=series(asset), months={'1m':31,'3m':93,'6m':186,'1y':366}[$('period').value],limit=new Date(values.at(-1).d.getTime()-months*86400000);
let x=values.map(z=>z.x), trace=[];
const saved=savedData();$('draw').value=saved.note||'';
const last=values[values.length-1];
const liveColor=last.c>=last.o?'#0b8864':'#d04d55';
if($('style').value==='candlestick'){trace.push({type:'candlestick',x,open:values.map(z=>z.o),high:values.map(z=>z.h),low:values.map(z=>z.l),close:values.map(z=>z.c),name:asset.symbol,increasing:{line:{color:'#0e886c'}},decreasing:{line:{color:'#c84b54'}}})}
else trace.push({type:'scatter',mode:'lines',x,y:values.map(z=>z.c),name:asset.symbol,line:{color:'#19657b',width:2}});
for(let [id,title,fn,color,n] of [['sma20','SMA20',sma,'#dd991e',20],['sma50','SMA50',sma,'#934fad',50],['ema20','EMA20',ema,'#2e73b2',20]]){
if($(id).checked)trace.push({type:'scatter',mode:'lines',x,y:fn(values,n),name:title,line:{color,width:1.5}})}
let compare=$('compare').value;
if(compare&&compare!==$('idx').value){let other=db.indices[compare]?.assets.find(z=>z.symbol===db.indices[compare].index);
if(other){let a=series(other);let base=a[0]?.c||1;trace.push({type:'scatter',mode:'lines',x:a.map(z=>z.x),y:a.map(z=>z.c/base*values[0].c),name:'Compare '+compare+' (normalized)',line:{dash:'dot',color:'#596f78'}})}}
trace.push({type:'scatter',mode:'lines',x:[values[0].x,last.x],y:[last.c,last.c],name:'CURRENT '+last.c.toFixed(2),line:{color:liveColor,width:1.5,dash:'dot'},hoverinfo:'skip'});
let xEnd=values.at(-1).x;let xStart=values.find(z=>z.d>=limit)?.x||values[0].x;
const config={responsive:true,displaylogo:false,modeBarButtonsToAdd:['drawline','drawopenpath','drawclosedpath','drawcircle','drawrect','eraseshape']};
Plotly.react('chart',trace,{
title:asset.symbol+' — '+group.name,
xaxis:{type:'date',range:[xStart,xEnd],rangeslider:{visible:false},showspikes:true,spikemode:'across',spikesnap:'cursor',spikecolor:'#7b9ba2'},
yaxis:{title:'Price',showspikes:true,spikemode:'across',spikesnap:'cursor',spikecolor:'#7b9ba2'},
paper_bgcolor:'#fff',plot_bgcolor:'#fff',dragmode:'pan',hovermode:'x unified',
legend:{orientation:'h'},margin:{l:65,r:25,t:70,b:55},
uirevision:asset.symbol,shapes:saved.shapes||[]
},config).then(attachShapeEvents);
const hasVolume=values.some(z=>Number(z.v)>0);
$('volumePanel').style.display=$('volumeToggle').checked&&hasVolume?'block':'none';
if($('volumeToggle').checked&&hasVolume)Plotly.react('volumePanel',[
{type:'bar',x,y:values.map(z=>z.v),name:'Volume',marker:{color:values.map(z=>z.c>=z.o?'#71bcaa':'#dfa1a5')}}],
{margin:{l:65,r:25,t:12,b:36},xaxis:{type:'date',range:[xStart,xEnd]},yaxis:{title:'Volume',tickformat:'~s'},
paper_bgcolor:'#fff',plot_bgcolor:'#fff'}, {responsive:true,displaylogo:false});
if(!hasVolume && $('volumeToggle').checked)$('notice').textContent+=' Volume not published by data source for this symbol.';
$('rsiPanel').style.display=$('rsiToggle').checked?'block':'none';
if($('rsiToggle').checked){Plotly.react('rsiPanel',[{type:'scatter',mode:'lines',x,y:rsi(values),line:{color:'#7652ae'},name:'RSI 14'}],{xaxis:{type:'date',range:[xStart,xEnd]},yaxis:{range:[0,100],title:'RSI'},shapes:[{type:'line',x0:0,x1:1,xref:'paper',y0:70,y1:70,line:{color:'#cb6969',dash:'dot'}},{type:'line',x0:0,x1:1,xref:'paper',y0:30,y1:30,line:{color:'#3aa88a',dash:'dot'}}],margin:{l:65,r:25,t:15,b:40}}, {responsive:true,displaylogo:false})}
}
$('idx').onchange=()=>{candidates();draw()};$('asset').onchange=draw;
['period','style','sma20','sma50','ema20','rsiToggle','volumeToggle','compare'].forEach(id=>$(id).onchange=draw);
$('reset').onclick=()=>{Plotly.relayout('chart',{'xaxis.autorange':true,'yaxis.autorange':true})};
$('clearDrawings').onclick=()=>{const r=savedData();r.shapes=[];try{localStorage.setItem(storageKey(),JSON.stringify(r))}catch(e){}Plotly.relayout('chart',{shapes:[]})};
candidates();draw();
</script></body></html>
