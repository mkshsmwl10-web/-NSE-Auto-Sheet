
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVELECTRO Trend Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { box-sizing:border-box; }
body { margin:0; background:#0f172a; color:#e5e7eb; font-family:Arial,Helvetica,sans-serif; }
.header { padding:18px 22px; background:#111827; border-bottom:1px solid #334155; }
.title { font-size:24px; font-weight:700; }
.subtitle { margin-top:6px; color:#94a3b8; }
.status-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 20px; }
.status { padding:12px; border-radius:8px; text-align:center; font-weight:700; }
.positive { background:#14532d; color:#dcfce7; }
.negative { background:#7f1d1d; color:#fee2e2; }
.nodata { background:#374151; color:#f8fafc; }
.toolbar { padding:8px 20px 14px; }
button { border:1px solid #475569; background:#1e293b; color:white; padding:9px 17px; margin-right:7px; border-radius:6px; cursor:pointer; font-weight:700; }
button.active { background:#2563eb; }
.info { padding:0 20px 10px; color:#cbd5e1; }
#chart { width:100%; height:650px; }
@media(max-width:700px) {
  .status-grid { grid-template-columns:1fr; }
  #chart { height:520px; }
}
</style>
</head>
<body>
<div class="header">
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
</div>
<div class="status-grid">
  <div id="dailyStatus" class="status">Daily</div>
  <div id="weeklyStatus" class="status">Weekly</div>
  <div id="monthlyStatus" class="status">Monthly</div>
</div>
<div class="toolbar">
  <button id="Daily" onclick="renderTF('Daily')">1D</button>
  <button id="Weekly" onclick="renderTF('Weekly')">1W</button>
  <button id="Monthly" onclick="renderTF('Monthly')">1M</button>
  <button onclick="fitChart()">Fit</button>
</div>
<div class="info" id="info"></div>
<div id="chart"></div>
<script>
const DATA = {"name": "MVELECTRO", "code": "MVELECTRO", "cmp": 832.75, "Daily": {"trend": "POSITIVE", "reference": 795.0, "bars": [{"time": "2026-08-06", "open": 520.0, "high": 624.0, "low": 520.0, "close": 624.0}, {"time": "2026-08-07", "open": 665.5, "high": 686.5, "low": 593.05, "close": 611.7}, {"time": "2026-08-10", "open": 600.0, "high": 644.8, "low": 595.5, "close": 614.8}, {"time": "2026-08-11", "open": 622.4, "high": 628.75, "low": 595.0, "close": 599.45}, {"time": "2026-08-12", "open": 600.9, "high": 607.7, "low": 571.2, "close": 582.85}, {"time": "2026-08-13", "open": 585.15, "high": 628.0, "low": 585.15, "close": 615.1}, {"time": "2026-08-14", "open": 618.8, "high": 632.0, "low": 585.0, "close": 588.65}, {"time": "2026-08-17", "open": 588.0, "high": 595.0, "low": 566.5, "close": 570.1}, {"time": "2026-08-18", "open": 574.0, "high": 583.85, "low": 556.15, "close": 574.1}, {"time": "2026-08-19", "open": 577.75, "high": 583.55, "low": 560.15, "close": 570.2}, {"time": "2026-08-20", "open": 570.95, "high": 578.8, "low": 564.4, "close": 568.3}, {"time": "2026-08-21", "open": 569.9, "high": 594.1, "low": 567.5, "close": 591.15}, {"time": "2026-08-24", "open": 592.95, "high": 601.9, "low": 574.25, "close": 578.95}, {"time": "2026-08-25", "open": 579.0, "high": 582.7, "low": 559.0, "close": 564.15}, {"time": "2026-08-26", "open": 525.0, "high": 566.45, "low": 516.55, "close": 560.15}, {"time": "2026-08-27", "open": 565.5, "high": 672.15, "low": 559.95, "close": 646.8}, {"time": "2026-08-28", "open": 649.9, "high": 768.0, "low": 638.5, "close": 719.55}, {"time": "2026-08-31", "open": 718.95, "high": 780.0, "low": 693.05, "close": 760.45}, {"time": "2026-09-01", "open": 757.65, "high": 757.7, "low": 696.3, "close": 713.7}, {"time": "2026-09-02", "open": 708.95, "high": 724.5, "low": 675.4, "close": 686.05}, {"time": "2026-09-03", "open": 685.0, "high": 744.8, "low": 661.65, "close": 730.65}, {"time": "2026-09-04", "open": 730.65, "high": 752.4, "low": 710.0, "close": 729.7}, {"time": "2026-09-07", "open": 729.7, "high": 841.1, "low": 725.0, "close": 806.45}, {"time": "2026-09-08", "open": 820.0, "high": 917.8, "low": 815.2, "close": 883.25}, {"time": "2026-09-09", "open": 887.85, "high": 948.0, "low": 880.0, "close": 917.5}, {"time": "2026-09-10", "open": 911.45, "high": 911.45, "low": 826.1, "close": 835.45}, {"time": "2026-09-11", "open": 843.0, "high": 874.25, "low": 817.5, "close": 841.7}, {"time": "2026-09-14", "open": 841.7, "high": 841.7, "low": 841.7, "close": 841.7}, {"time": "2026-09-15", "open": 856.0, "high": 856.0, "low": 757.55, "close": 777.0}, {"time": "2026-09-16", "open": 777.1, "high": 845.7, "low": 736.0, "close": 819.05}, {"time": "2026-09-17", "open": 822.3, "high": 828.2, "low": 785.0, "close": 796.0}, {"time": "2026-09-18", "open": 795.0, "high": 842.0, "low": 776.0, "close": 832.75}]}, "Weekly": {"trend": "POSITIVE", "reference": 841.7, "bars": [{"time": "2026-08-07", "open": 520.0, "high": 686.5, "low": 520.0, "close": 611.7}, {"time": "2026-08-14", "open": 600.0, "high": 644.8, "low": 571.2, "close": 588.65}, {"time": "2026-08-21", "open": 588.0, "high": 595.0, "low": 556.15, "close": 591.15}, {"time": "2026-08-28", "open": 592.95, "high": 768.0, "low": 516.55, "close": 719.55}, {"time": "2026-09-04", "open": 718.95, "high": 780.0, "low": 661.65, "close": 729.7}, {"time": "2026-09-11", "open": 729.7, "high": 948.0, "low": 725.0, "close": 841.7}, {"time": "2026-09-18", "open": 841.7, "high": 856.0, "low": 736.0, "close": 832.75}]}, "Monthly": {"trend": "POSITIVE", "reference": 520.0, "bars": [{"time": "2026-08-31", "open": 520.0, "high": 780.0, "low": 516.55, "close": 760.45}]}};
let chart = null;
let candleSeries = null;

document.getElementById("title").textContent = DATA.name + " (" + DATA.code + ")";
document.getElementById("subtitle").textContent = "CMP: " + DATA.cmp;

function statusClass(trend) {
  if (trend === "POSITIVE") return "status positive";
  if (trend === "NEGATIVE") return "status negative";
  return "status nodata";
}

function setupStatuses() {
  [["dailyStatus","Daily"],["weeklyStatus","Weekly"],["monthlyStatus","Monthly"]].forEach(pair => {
    const el = document.getElementById(pair[0]);
    const tf = pair[1];
    el.className = statusClass(DATA[tf].trend);
    el.innerHTML = tf + "<br>" + DATA[tf].trend;
  });
}

function renderTF(tf) {
  document.querySelectorAll(".toolbar button").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById(tf);
  if (btn) btn.classList.add("active");

  const holder = document.getElementById("chart");
  holder.innerHTML = "";
  const item = DATA[tf];

  document.getElementById("info").innerHTML =
    "<b>" + tf + " Trend:</b> " + item.trend +
    " &nbsp;&nbsp; <b>Current Reference Open:</b> " +
    (item.reference === null ? "-" : item.reference);

  chart = LightweightCharts.createChart(holder, {
    width:holder.clientWidth,
    height:holder.clientHeight,
    layout:{ background:{ color:"#0f172a" }, textColor:"#cbd5e1" },
    grid:{ vertLines:{ color:"#1e293b" }, horzLines:{ color:"#1e293b" } },
    rightPriceScale:{ borderColor:"#475569" },
    timeScale:{ borderColor:"#475569", timeVisible:true }
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:"#22c55e",
    downColor:"#ef4444",
    borderVisible:false,
    wickUpColor:"#22c55e",
    wickDownColor:"#ef4444"
  });

  candleSeries.setData(item.bars);

  if (item.reference !== null) {
    candleSeries.createPriceLine({
      price:item.reference,
      color:"#f59e0b",
      lineWidth:2,
      lineStyle:2,
      axisLabelVisible:true,
      title:"Reference Open"
    });
  }

  chart.timeScale().fitContent();
}

function fitChart() {
  if (chart) chart.timeScale().fitContent();
}

setupStatuses();
try {
  renderTF("Daily");
} catch (err) {
  document.getElementById("chart").innerHTML =
    '<div style="padding:24px;color:#fecaca;font-weight:700;">Chart error: ' +
    String(err) + '</div>';
  console.error(err);
}

window.addEventListener("resize", () => {
  if (!chart) return;
  const holder = document.getElementById("chart");
  chart.applyOptions({ width:holder.clientWidth });
});
</script>
</body>
</html>
